<html>
<head>
<title>Hebrew Sample</title>
<style>
body {
    background-color: #f4f1ea; /* Light parchment color */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Times New Roman', serif;
}

.verse {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 80%;
    border-left: 5px solid #8b5e3c; /* Accented border */
}

.text {
    display: block;
    direction: rtl; /* Sets text flow from Right-to-Left */
    font-size: 2.5rem;
    color: #2c3e50;
    margin-bottom: 1rem;
    line-height: 1.6;
}

.ref {
    display: block;
    font-size: 1.1rem;
    color: #7f8c8d;
    font-style: italic;
    border-top: 1px solid #eee;
    padding-top: 0.5rem;
}
</style>
</head>
<body>

<div class="verse">
<span class="text">
בֵּאלֹהִים אֲהַלֵּל דָּבָר בַּיהוָה אֲהַלֵּל דָּבָר׃
</span>
<span class="ref">Psalm 56:10</span>
</div>

</body>
</html>
